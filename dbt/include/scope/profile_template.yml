fixed:
  type: scope

prompts:
  adla_account:
    hint: "ADLA account name"
  storage_account:
    hint: "Azure Storage account for Delta tables"
  container:
    hint: "ADLS container name"
  delta_base_path:
    hint: "Path prefix for Delta tables within the container"
    default: "delta"
  au:
    hint: "Analytics Units per SCOPE job"
    default: 100
  priority:
    hint: "Job priority (lower = higher priority)"
    default: 1
  authentication:
    hint: "Auth mode: 'cli' (AzureCliCredential) or 'token_credential' (custom)"
    default: "cli"
  credential_class:
    hint: "Dotted path to a TokenCredential implementation (e.g. 'fabric_entra_auth.EntraTokenCredential') — only used when authentication='token_credential'"
    default: ""
  credential_kwargs:
    hint: "Mapping of kwargs forwarded to credential_class — only used when authentication='token_credential'"
    default: {}
