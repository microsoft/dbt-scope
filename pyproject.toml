[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbt-scope"
version = "0.1.0"
description = "dbt adapter for ADLA SCOPE — generates SCOPE scripts to build Delta tables from SS files"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "dbt-core~=1.9",
    "dbt-adapters~=1.13",
    "dbt-common~=1.14",
    "azure-identity>=1.15.0",
    "azure-datalake-store>=0.0.53",
    "azure-storage-file-datalake>=12.14.0",
    "duckdb>=1.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "agate>=1.9.1",
    "sqlglot>=26.0.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.5.0",
    "duckdb>=1.0.0",
    "ruff>=0.8.0",
]

[project.entry-points."dbt.adapters"]
scope = "dbt.adapters.scope"

[tool.hatch.build.targets.wheel]
packages = ["dbt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "T20",   # flake8-print (no print() in library code)
    "RUF",   # ruff-specific rules
]
ignore = [
    "T201",  # allow print() in tests and scripts
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T201"]  # allow print in tests

[tool.ruff.format]
quote-style = "double"
